name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**"]
  pull_request:
    branches: [main, master, "feat/**"]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript (no emit)
        run: npm run typecheck
        env:
          # Allow typecheck without real secrets; code must not require values at compile time
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: example-anon-key
          NEXT_PUBLIC_PLATFORM_SHOP_ID: 00000000-0000-0000-0000-000000000000

      - name: Phase 1 access smoke tests
        run: npm run test:phase1

      # Full-repo ESLint currently has large historical debt; report but do not block.
      - name: ESLint (advisory)
        run: npm run lint
        continue-on-error: true
